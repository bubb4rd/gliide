[package]
name = "resume-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# PDF text read-back; already in the tree through typst-render, with the same (no default) features.
hayro-interpret = { version = "0.7", default-features = false }
# The export folder's PDFs previewed as SVG; also already in the tree through typst-svg, with no default features.
hayro-svg = { version = "0.7", default-features = false }
kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"

[dev-dependencies]
resume-core = { path = "../resume-core" }
