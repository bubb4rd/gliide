[package]
name = "ez-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ez"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
resume-core = { path = "../resume-core" }
resume-ingest = { path = "../resume-ingest" }
resume-llm = { path = "../resume-llm" }
resume-render = { path = "../resume-render" }
resume-tailor = { path = "../resume-tailor" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
