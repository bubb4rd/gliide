[package]
name = "resume-llm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Model access for easyshmeezy: the Llm trait, the claude CLI provider, prompts"

[dependencies]
jsonschema = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
