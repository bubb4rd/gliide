[package]
name = "resume-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Model access for gliide: the Llm trait, the agent CLI providers (claude, codex, agy), prompts"

[dependencies]
jsonschema = { version = "0.58", default-features = false }
resume-core = { path = "../resume-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
