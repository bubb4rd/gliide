[package]
name = "resume-pipeline"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The per-posting steps the ez CLI and the app share: postings, Extract and Suggest keys, templates, today"

[dependencies]
resume-core = { path = "../resume-core" }
resume-ingest = { path = "../resume-ingest" }
resume-llm = { path = "../resume-llm" }
resume-render = { path = "../resume-render" }
# DOCX import: the zip holding `word/document.xml`, read only (Word deflates its parts).
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
