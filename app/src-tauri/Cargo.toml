[package]
name = "easyshmeezy"
version = "0.1.0"
description = "Tailor a one-page resume to a job posting, honestly"
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name apart from the bin's (cargo#8519 on Windows).
name = "easyshmeezy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
resume-core = { path = "../../crates/resume-core" }
resume-ingest = { path = "../../crates/resume-ingest" }
resume-llm = { path = "../../crates/resume-llm" }
resume-pipeline = { path = "../../crates/resume-pipeline" }
resume-render = { path = "../../crates/resume-render" }
resume-store = { path = "../../crates/resume-store" }
resume-tailor = { path = "../../crates/resume-tailor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
window-vibrancy = "0.8"

# The exported PDF's text, read back with PDFKit for the on-file score.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument"] }
