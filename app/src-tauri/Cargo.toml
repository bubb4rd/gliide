[package]
name = "gliide"
version = "0.2.2"
description = "Tailor a one-page resume to a job posting, honestly"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name apart from the bin's (cargo#8519 on Windows).
name = "gliide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Calendar invites (.ics): a TZID time converted with the IANA database; the Mac's zone named for the invite call.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
# Company logos you set: decoded, scaled to fit and stored as PNG (Typst's formats already built, plus BMP and ICO).
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
percent-encoding = "2"
resume-core = { path = "../../crates/resume-core" }
resume-ingest = { path = "../../crates/resume-ingest" }
resume-llm = { path = "../../crates/resume-llm" }
resume-pipeline = { path = "../../crates/resume-pipeline" }
resume-render = { path = "../../crates/resume-render" }
resume-store = { path = "../../crates/resume-store" }
resume-tailor = { path = "../../crates/resume-tailor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Updates: the newest GitHub release's latest.json, its bundle's signature checked against tauri.conf.json's pubkey.
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
window-vibrancy = "0.8"

# The exported PDF's text, read back with PDFKit for the on-file score.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument"] }

# The clipboard's image file or picture, for a pasted company logo.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"
