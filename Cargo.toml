[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Typst, image codecs and SQLite are slow unoptimized: a debug build of the app would take seconds per rebuild of
# the preview. Dependencies build optimized; workspace crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
